<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Іконка вкладки (favicon) -->
<link rel="icon" type="image/png" href="Фавікон.png">
  <title>Самоперевірка</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    } catch (e) {
      console.error(e);
    }
  </script>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f4f6f8);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #222222);
      --hint: var(--tg-theme-hint-color, #777777);
      --btn: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --success: #28a745;
      --warning: #d97706;
      --error: #dc3545;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      text-align: center;
      margin-bottom: 14px;
    }
    .task-image-container {
      margin-bottom: 16px;
      text-align: center;
      display: none;
    }
    .task-image {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid #e1e4e8;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .input-field {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1.5px solid #bbb;
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      background: var(--card-bg);
      color: var(--text);
      transition: all 0.2s ease;
    }
    .input-field:focus {
      border-color: var(--btn);
    }
    .input-locked {
      background-color: rgba(40, 167, 69, 0.08) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
      cursor: not-allowed;
    }
    
    /* Одиночний вибір */
    .single-options-grid {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 10px;
    }
    .single-btn {
      flex: 1;
      padding: 12px 0;
      font-size: 16px;
      font-weight: 700;
      background: var(--card-bg);
      border: 1.5px solid #bbb;
      border-radius: 10px;
      color: #000000 !important;
      opacity: 1 !important;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }
    .single-btn.selected {
      border-color: var(--btn) !important;
      background-color: rgba(36, 129, 204, 0.12) !important;
      color: var(--btn) !important;
    }
    .single-btn.single-correct {
      border-color: var(--success) !important;
      background-color: rgba(40, 167, 69, 0.15) !important;
      color: var(--success) !important;
      cursor: not-allowed;
    }
    .single-btn.single-incorrect {
      border-color: var(--error) !important;
      background-color: rgba(220, 53, 69, 0.12) !important;
      color: var(--error) !important;
    }

    /* Відповідності */
    .matching-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .matching-label {
      font-size: 16px;
      font-weight: bold;
    }
    .matching-select {
      padding: 8px 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1.5px solid #bbb;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
      transition: all 0.2s ease;
      min-width: 70px;
    }
    .select-correct {
      border-color: var(--success) !important;
      background-color: rgba(40, 167, 69, 0.12) !important;
      color: var(--success) !important;
      font-weight: bold;
      cursor: not-allowed;
    }
    .select-incorrect {
      border-color: var(--error) !important;
      background-color: rgba(220, 53, 69, 0.12) !important;
      color: var(--error) !important;
    }

    button.submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      font-size: 16px;
      font-weight: 600;
      background-color: var(--btn);
      color: var(--btn-text);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button.reset-full-btn {
      width: 100%;
      padding: 11px;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 500;
      background-color: transparent;
      color: var(--hint);
      border: 1px dashed #bbb;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button.reset-full-btn:active {
      background-color: rgba(0,0,0,0.04);
    }
    #result-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 15px;
      line-height: 1.4;
    }
    .result-success {
      background-color: rgba(40, 167, 69, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }
    .result-warning {
      background-color: rgba(217, 119, 6, 0.15);
      color: var(--warning);
      border: 1px solid var(--warning);
    }
    .result-error {
      background-color: rgba(220, 53, 69, 0.15);
      color: var(--error);
      border: 1px solid var(--error);
    }
    .attempts-badge {
      display: block;
      font-size: 13px;
      margin-top: 4px;
      opacity: 0.85;
      font-weight: normal;
    }
    .loader {
      text-align: center;
      color: var(--hint);
      padding: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2 id="task-title">Завантаження...</h2>
    
    <div id="image-container" class="task-image-container">
      <img id="task-img" class="task-image" alt="Умова задачі" />
    </div>

    <div id="loader" class="loader">Зчитування даних із таблиці...</div>
    <div id="form-container" style="display: none;"></div>
    <div id="result-box"></div>
    <button class="reset-full-btn" id="btn-reset-full" style="display: none;">🔄 Розв'язати завдання ще раз</button>
  </div>
</div>

<script>
  const SHEET_ID = '1rMrjDLFl08wdqO0vF2wRO1SUI-FmMULUUklqaUtP7Fg';
  const SHEET_GID = '121652371'; 
  const SALT = "TeacherK_Secret_2026_"; 

  let lockedCorrectLetters = [];
  let currentTask = null;
  let selectedSingleChoice = null;
  let attemptsCount = 0;

  async function sha256(str) {
    const buffer = new TextEncoder().encode(str);
    const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function computeHash(taskId, rawValue) {
    const raw = (taskId || "").trim() + "_" + (rawValue || "").trim() + "_" + SALT;
    return await sha256(raw);
  }

  function saveUserAnswer(taskId, dataObj) {
    const raw = JSON.stringify(dataObj);
    try {
      localStorage.setItem('saved_ans_' + taskId, raw);
    } catch (e) {}

    try {
      const cloud = window.Telegram?.WebApp?.CloudStorage;
      if (cloud && cloud.setItem) {
        const safeKey = ('ans_' + taskId).replace(/[^a-zA-Z0-9_]/g, '_').slice(0, 120);
        cloud.setItem(safeKey, raw, (err) => {
          if (err) console.error("CloudStorage save error", err);
        });
      }
    } catch (e) {}
  }

  function loadUserAnswer(taskId, callback) {
    let localData = null;
    try {
      const raw = localStorage.getItem('saved_ans_' + taskId);
      if (raw) localData = JSON.parse(raw);
    } catch (e) {}

    try {
      const cloud = window.Telegram?.WebApp?.CloudStorage;
      if (cloud && cloud.getItem) {
        const safeKey = ('ans_' + taskId).replace(/[^a-zA-Z0-9_]/g, '_').slice(0, 120);
        cloud.getItem(safeKey, (err, val) => {
          if (!err && val) {
            try {
              callback(JSON.parse(val));
              return;
            } catch (e) {}
          }
          callback(localData);
        });
        return;
      }
    } catch (e) {}

    callback(localData);
  }

  function clearUserAnswer(taskId) {
    try {
      localStorage.removeItem('saved_ans_' + taskId);
    } catch (e) {}

    try {
      const cloud = window.Telegram?.WebApp?.CloudStorage;
      if (cloud && cloud.removeItem) {
        const safeKey = ('ans_' + taskId).replace(/[^a-zA-Z0-9_]/g, '_').slice(0, 120);
        cloud.removeItem(safeKey);
      }
    } catch (e) {}
  }

  function getTaskId() {
    try {
      if (window.Telegram?.WebApp?.initDataUnsafe?.start_param) {
        return String(window.Telegram.WebApp.initDataUnsafe.start_param).trim();
      }
    } catch (e) {}

    const urlParams = new URLSearchParams(window.location.search);
    let tid = urlParams.get('task') || urlParams.get('startapp') || urlParams.get('start_param');
    if (tid) return tid.trim();

    if (window.location.hash) {
      const hash = window.location.hash.substring(1);
      const hashParams = new URLSearchParams(hash);
      let p = hashParams.get('tgWebAppStartParam') || hashParams.get('startapp') || hashParams.get('start_param');
      if (p) return decodeURIComponent(p).trim();

      const webAppData = hashParams.get('tgWebAppData');
      if (webAppData) {
        const inner = new URLSearchParams(webAppData);
        let innerP = inner.get('start_param');
        if (innerP) return decodeURIComponent(innerP).trim();
      }
    }

    const fullMatch = window.location.href.match(/(?:startapp|start_param|tgWebAppStartParam)=([^&#]+)/i);
    if (fullMatch && fullMatch[1]) {
      return decodeURIComponent(fullMatch[1]).trim();
    }

    return null;
  }

  function parseCSVLine(line) {
    const result = [];
    let cur = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (inQuotes && line[i + 1] === '"') {
          cur += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        result.push(cur.trim());
        cur = '';
      } else {
        cur += char;
      }
    }
    result.push(cur.trim());
    return result;
  }

  function formatDriveUrl(url) {
    if (!url) return '';
    url = url.trim();
    const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (match && match[1]) {
      return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
    }
    const idMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
    if (idMatch && idMatch[1] && url.includes('drive.google.com')) {
      return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w1000`;
    }
    return url;
  }

  async function init() {
    const titleEl = document.getElementById('task-title');
    const loaderEl = document.getElementById('loader');
    const formContainer = document.getElementById('form-container');
    const imgContainer = document.getElementById('image-container');
    const imgEl = document.getElementById('task-img');

    const taskId = getTaskId();
    updateTabTitle(taskId);

function updateTabTitle(taskId) {
  if (!taskId) {
    document.title = "Самоперевірка | Teacher Kalugin";
    return;
  }
  
  const parts = taskId.split('_');
  let datePart = parts[0];
  const numPart = parts[1]; // якщо немає підкреслення, буде undefined

  // Перетворюємо рік 26 -> 2026
  const dParts = datePart.split('.');
  if (dParts.length === 3 && dParts[2].length === 2) {
    dParts[2] = "20" + dParts[2];
    datePart = dParts.join('.');
  }

  // Якщо є номер — пишемо "Задача дня №X | дата", якщо немає — "Задача дня | дата"
  if (numPart) {
    document.title = `Задача дня №${numPart} | ${datePart}`;
  } else {
    document.title = `Задача дня | ${datePart}`;
  }
}

    if (!taskId) {
      titleEl.innerText = "Помилка";
      loaderEl.innerHTML = "Не вказано номер завдання.<br><small style='color:grey;'>URL: " + window.location.search + window.location.hash + "</small>";
      return;
    }

    loaderEl.innerText = `Завантаження завдання ${taskId}...`;

    try {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error("HTTP " + response.status);
      const csvText = await response.text();

      const lines = csvText.split(/\r?\n/).filter(l => l.trim().length > 0);
      let task = null;

      for (let i = 1; i < lines.length; i++) {
        const cols = parseCSVLine(lines[i]);
        const idVal = cols[0] ? cols[0].replace(/^"|"$/g, '').trim() : '';
        if (idVal === taskId) {
          task = {
            task_id: idVal,
            task_type: (cols[1] || 'text').replace(/^"|"$/g, '').trim().toLowerCase(),
            answer_hash: cols[2] ? cols[2].replace(/^"|"$/g, '').trim() : '',
            explanation: cols[3] ? cols[3].replace(/^"|"$/g, '').trim() : '',
            image_url: cols[4] ? cols[4].replace(/^"|"$/g, '').trim() : ''
          };
          break;
        }
      }

      if (!task) {
        titleEl.innerText = "Завдання не знайдено";
        loaderEl.innerText = `Завдання "${taskId}" відсутнє в таблиці.`;
        return;
      }

      currentTask = task;
      loaderEl.style.display = 'none';
      formContainer.style.display = 'block';

      let displayId = task.task_id;
      if (displayId.includes('.26_')) {
        displayId = displayId.replace('.26_', '.2026_');
      }
      titleEl.innerText = `📚 Задача дня_${displayId}`;

      const candidateUrl = formatDriveUrl(task.image_url) || `tasks/${task.task_id}.png`;
      imgEl.onload = () => { imgContainer.style.display = 'block'; };
      imgEl.onerror = () => {
        if (!task.image_url && !imgEl.dataset.triedJpg) {
          imgEl.dataset.triedJpg = 'true';
          imgEl.src = `tasks/${task.task_id}.jpg`;
        } else {
          imgContainer.style.display = 'none';
        }
      };
      imgEl.src = candidateUrl;

      document.getElementById('btn-reset-full').addEventListener('click', fullResetTask);

      renderForm(task);
    } catch (e) {
      titleEl.innerText = "Помилка зв'язку";
      loaderEl.innerText = "Не вдалося отримати дані з таблиці.";
    }
  }

  function updateDisabledOptions() {
    const selects = [1, 2, 3].map(n => document.getElementById(`match-${n}`));
    if (!selects[0] || !selects[1] || !selects[2]) return;

    const selectedValues = selects.map(s => s.value).filter(v => v !== "");

    selects.forEach(select => {
      if (select.disabled) return;

      Array.from(select.options).forEach(opt => {
        if (!opt.value) return;

        const isChosenElsewhere = selectedValues.includes(opt.value) && select.value !== opt.value;
        const isLockedCorrect = lockedCorrectLetters.includes(opt.value);

        opt.disabled = isChosenElsewhere || isLockedCorrect;
      });
    });
  }

  function fullResetTask() {
    if (!currentTask) return;
    clearUserAnswer(currentTask.task_id);
    lockedCorrectLetters = [];
    selectedSingleChoice = null;
    attemptsCount = 0;

    const resultBox = document.getElementById('result-box');
    const btnResetFull = document.getElementById('btn-reset-full');
    const btnCheck = document.getElementById('btn-check');

    if (resultBox) resultBox.style.display = 'none';
    if (btnResetFull) btnResetFull.style.display = 'none';

    if (currentTask.task_type === 'matching') {
      [1, 2, 3].forEach(num => {
        const el = document.getElementById(`match-${num}`);
        if (el) {
          el.value = "";
          el.disabled = false;
          el.className = 'matching-select';
          el.removeAttribute('style');
        }
      });
      updateDisabledOptions();
      if (btnCheck) btnCheck.style.display = 'block';
    } else if (currentTask.task_type === 'single' || currentTask.task_type === 'choice') {
      ['А', 'Б', 'В', 'Г', 'Д'].forEach(l => {
        const btn = document.getElementById(`opt-${l}`);
        if (btn) {
          btn.className = 'single-btn';
          btn.disabled = false;
          btn.removeAttribute('style');
        }
      });
      if (btnCheck) btnCheck.style.display = 'none';
    } else {
      const inp = document.getElementById('text-answer');
      if (inp) {
        inp.value = "";
        inp.disabled = false;
        inp.className = 'input-field';
        inp.removeAttribute('style');
      }
      if (btnCheck) btnCheck.style.display = 'block';
    }
  }

  function renderForm(task) {
    const container = document.getElementById('form-container');
    const type = (task.task_type || '').trim();

    if (type === 'matching') {
      container.innerHTML = `
        <div style="margin-bottom: 14px; font-size: 14px; color: var(--hint);">
          Установіть відповідності:
        </div>
        ${[1, 2, 3].map(num => `
          <div class="matching-row">
            <span class="matching-label">${num}</span>
            <select class="matching-select" id="match-${num}">
              <option value="">—</option>
              <option value="А">А</option>
              <option value="Б">Б</option>
              <option value="В">В</option>
              <option value="Г">Г</option>
              <option value="Д">Д</option>
            </select>
          </div>
        `).join('')}
        <button class="submit-btn" id="btn-check">Перевірити</button>
      `;

      [1, 2, 3].forEach(num => {
        const el = document.getElementById(`match-${num}`);
        el.addEventListener('change', () => {
          if (!el.disabled) {
            el.className = 'matching-select';
            const btnCheck = document.getElementById('btn-check');
            const resultBox = document.getElementById('result-box');
            if (btnCheck) btnCheck.style.display = 'block';
            if (resultBox) resultBox.style.display = 'none';
          }
          updateDisabledOptions();
        });
      });

      document.getElementById('btn-check').addEventListener('click', () => {
        attemptsCount++;
        checkMatching(task.answer_hash, task.explanation, task.task_id, true);
      });

      loadUserAnswer(task.task_id, (saved) => {
        if (saved && saved.type === 'matching') {
          attemptsCount = saved.attempts || 1;
          const s1 = document.getElementById('match-1');
          const s2 = document.getElementById('match-2');
          const s3 = document.getElementById('match-3');
          if (s1 && saved.val1) s1.value = saved.val1;
          if (s2 && saved.val2) s2.value = saved.val2;
          if (s3 && saved.val3) s3.value = saved.val3;
          updateDisabledOptions();
          checkMatching(task.answer_hash, task.explanation, task.task_id, false);
        }
      });
    } else if (type === 'single' || type === 'choice') {
      container.innerHTML = `
        <div style="margin-bottom: 8px; font-size: 14px; color: var(--hint);">Оберіть одну правильну відповідь:</div>
        <div class="single-options-grid">
          ${['А', 'Б', 'В', 'Г', 'Д'].map(letter => `
            <button class="single-btn" id="opt-${letter}" type="button">${letter}</button>
          `).join('')}
        </div>
        <button class="submit-btn" id="btn-check" style="display: none;">Перевірити</button>
      `;

      ['А', 'Б', 'В', 'Г', 'Д'].forEach(letter => {
        const btn = document.getElementById(`opt-${letter}`);
        btn.addEventListener('click', () => {
          if (btn.disabled) return;
          selectedSingleChoice = letter;

          ['А', 'Б', 'В', 'Г', 'Д'].forEach(l => {
            const b = document.getElementById(`opt-${l}`);
            if (b && !b.classList.contains('single-correct')) {
              b.className = (l === letter) ? 'single-btn selected' : 'single-btn';
            }
          });

          const resultBox = document.getElementById('result-box');
          if (resultBox) resultBox.style.display = 'none';

          const btnCheck = document.getElementById('btn-check');
          if (btnCheck) btnCheck.style.display = 'block';
        });
      });

      document.getElementById('btn-check').addEventListener('click', () => {
        attemptsCount++;
        checkSingle(task.answer_hash, task.explanation, task.task_id, true);
      });

      loadUserAnswer(task.task_id, (saved) => {
        if (saved && saved.type === 'single' && saved.value) {
          attemptsCount = saved.attempts || 1;
          selectedSingleChoice = saved.value;
          const b = document.getElementById(`opt-${saved.value}`);
          if (b) b.classList.add('selected');
          checkSingle(task.answer_hash, task.explanation, task.task_id, false);
        }
      });
    } else {
      container.innerHTML = `
        <div style="margin-bottom: 10px; font-size: 14px; color: var(--hint);">Уведіть відповідь:</div>
        <input type="text" id="text-answer" class="input-field" placeholder="" autocomplete="off" />
        <button class="submit-btn" id="btn-check">Перевірити</button>
      `;

      const inputEl = document.getElementById('text-answer');
      inputEl.addEventListener('input', () => {
        inputEl.style.borderColor = '#bbb';
      });

      document.getElementById('btn-check').addEventListener('click', () => {
        attemptsCount++;
        checkText(task.answer_hash, task.explanation, task.task_id, true);
      });

      loadUserAnswer(task.task_id, (saved) => {
        if (saved && saved.type === 'text' && saved.value !== undefined) {
          attemptsCount = saved.attempts || 1;
          const inp = document.getElementById('text-answer');
          if (inp) {
            inp.value = saved.value;
            checkText(task.answer_hash, task.explanation, task.task_id, false);
          }
        }
      });
    }
  }

  function normalizeLetter(ch) {
    ch = (ch || '').toUpperCase().trim();
    const map = {
      'A': 'А', 'B': 'В', 'C': 'С', 'E': 'Е', 'H': 'Н',
      'I': 'І', 'O': 'О', 'P': 'Р', 'T': 'Т', 'X': 'Х'
    };
    return map[ch] || ch;
  }

  function cleanString(str) {
    return (str || '')
      .toString()
      .toLowerCase()
      .replace(/[–—−]/g, '-')
      .replace(/,/g, '.')
      .replace(/\s+/g, '')
      .trim();
  }

  async function checkSingle(correctHash, explanation, taskId, triggerHaptic) {
    const btnCheck = document.getElementById('btn-check');
    const btnResetFull = document.getElementById('btn-reset-full');

    if (!selectedSingleChoice) {
      if (triggerHaptic) alert("Будь ласка, оберіть варіант відповіді.");
      return;
    }

    const userAns = normalizeLetter(selectedSingleChoice);
    const userHash = await computeHash(taskId, userAns);
    const isCorrect = (userHash === correctHash);

    const activeBtn = document.getElementById(`opt-${selectedSingleChoice}`);

    if (isCorrect) {
      ['А', 'Б', 'В', 'Г', 'Д'].forEach(l => {
        const b = document.getElementById(`opt-${l}`);
        if (b) {
          b.disabled = true;
          b.removeAttribute('style');
          if (l === userAns) {
            b.className = 'single-btn single-correct';
          } else {
            b.className = 'single-btn';
          }
        }
      });
      if (btnCheck) btnCheck.style.display = 'none';
      if (btnResetFull) btnResetFull.style.display = 'block';
    } else {
      if (activeBtn) {
        activeBtn.className = 'single-btn single-incorrect';
      }
      if (btnCheck) btnCheck.style.display = 'none';
      if (btnResetFull) btnResetFull.style.display = 'none';
    }

    if (taskId) {
      saveUserAnswer(taskId, {
        type: 'single',
        value: selectedSingleChoice,
        attempts: attemptsCount
      });
    }

    const successMsg = attemptsCount === 1 
      ? 'Бездоганно! Правильну відповідь обрано з 1-ї спроби.' 
      : `Саме так! Це правильна відповідь. <span class="attempts-badge">Використано спроб: ${attemptsCount}</span>`;

    displayResult(
      isCorrect ? 'success' : 'error',
      isCorrect ? successMsg : `Ця відповідь неправильна. Спробуйте ще раз. <span class="attempts-badge">Спроба: ${attemptsCount}</span>`,
      explanation,
      triggerHaptic
    );
  }

  async function checkText(correctHash, explanation, taskId, triggerHaptic) {
    const inputEl = document.getElementById('text-answer');
    const btnCheck = document.getElementById('btn-check');
    const btnResetFull = document.getElementById('btn-reset-full');
    if (!inputEl) return;
    const val = inputEl.value;
    const cleanUser = cleanString(val);

    const userHash = await computeHash(taskId, cleanUser);
    const isCorrect = (userHash === correctHash);

    if (isCorrect) {
      inputEl.className = 'input-field input-locked';
      inputEl.disabled = true;
      if (btnCheck) btnCheck.style.display = 'none';
      if (btnResetFull) btnResetFull.style.display = 'block';
    } else {
      inputEl.style.borderColor = 'var(--error)';
      if (btnResetFull) btnResetFull.style.display = 'none';
    }

    if (taskId && val) {
      saveUserAnswer(taskId, {
        type: 'text',
        value: val,
        attempts: attemptsCount
      });
    }

    const successMsg = attemptsCount === 1 
      ? 'Бездоганно! Правильну відповідь уведено з першої спроби.' 
      : `Саме так! Це правильна відповідь. <span class="attempts-badge">Використано спроб: ${attemptsCount}</span>`;

    displayResult(
      isCorrect ? 'success' : 'error',
      isCorrect ? successMsg : `Ця відповідь неправильна. Спробуйте ще раз. <span class="attempts-badge">Спроба: ${attemptsCount}</span>`,
      explanation,
      triggerHaptic
    );
  }

  async function checkMatching(correctHashesRaw, explanation, taskId, triggerHaptic) {
    const el1 = document.getElementById('match-1');
    const el2 = document.getElementById('match-2');
    const el3 = document.getElementById('match-3');
    const btnCheck = document.getElementById('btn-check');
    const btnResetFull = document.getElementById('btn-reset-full');
    if (!el1 || !el2 || !el3) return;

    const m1 = normalizeLetter(el1.value);
    const m2 = normalizeLetter(el2.value);
    const m3 = normalizeLetter(el3.value);

    if (!m1 || !m2 || !m3) {
      if (triggerHaptic) alert("Будь ласка, оберіть варіанти для всіх трьох пунктів.");
      return;
    }

    if (m1 === m2 || m1 === m3 || m2 === m3) {
      if (triggerHaptic) alert("Усі три варіанти відповіді мають бути різними!");
      return;
    }

    if (taskId) {
      saveUserAnswer(taskId, {
        type: 'matching',
        val1: el1.value,
        val2: el2.value,
        val3: el3.value,
        attempts: attemptsCount
      });
    }

    // Отримуємо 3 хеші з таблиці
    const parts = (correctHashesRaw || '').split(',').map(s => s.trim());
    const h1 = parts[0] || '';
    const h2 = parts[1] || '';
    const h3 = parts[2] || '';

    // Обчислюємо хеші для кожного пункту окремо
    const userH1 = await computeHash(taskId, "1-" + m1);
    const userH2 = await computeHash(taskId, "2-" + m2);
    const userH3 = await computeHash(taskId, "3-" + m3);

    const is1Correct = (userH1 === h1);
    const is2Correct = (userH2 === h2);
    const is3Correct = (userH3 === h3);

    lockedCorrectLetters = [];
    if (is1Correct) lockedCorrectLetters.push(m1);
    if (is2Correct) lockedCorrectLetters.push(m2);
    if (is3Correct) lockedCorrectLetters.push(m3);

    const applyStatus = (el, isCorrect) => {
      if (isCorrect) {
        el.className = 'matching-select select-correct';
        el.disabled = true;
      } else {
        el.className = 'matching-select select-incorrect';
        el.disabled = false;
      }
    };

    applyStatus(el1, is1Correct);
    applyStatus(el2, is2Correct);
    applyStatus(el3, is3Correct);

    let score = (is1Correct ? 1 : 0) + (is2Correct ? 1 : 0) + (is3Correct ? 1 : 0);

    if (score === 3) {
      btnCheck.style.display = 'none';
      if (btnResetFull) btnResetFull.style.display = 'block';

      const successMsg = attemptsCount === 1 
        ? 'Бездоганно! Правильні відповідності встановлено з 1-ї спроби.' 
        : `Саме так! Правильно: 3/3. <span class="attempts-badge">Використано спроб: ${attemptsCount}</span>`;

      displayResult('success', successMsg, explanation, triggerHaptic);
    } else {
      btnCheck.style.display = 'none';
      if (btnResetFull) btnResetFull.style.display = 'none';

      if (score > 0) {
        displayResult('warning', `Частково правильно: ${score}/3. Уточніть Вашу відповідь. <span class="attempts-badge">Спроба: ${attemptsCount}</span>`, explanation, triggerHaptic);
      } else {
        displayResult('error', `Правильних відповідей: 0/3. Спробуйте ще раз. <span class="attempts-badge">Спроба: ${attemptsCount}</span>`, explanation, triggerHaptic);
      }
    }

    updateDisabledOptions();
  }

  function displayResult(status, text, explanation, triggerHaptic = true) {
    const box = document.getElementById('result-box');
    if (!box) return;
    box.style.display = 'block';

    const tg = window.Telegram?.WebApp;
    if (status === 'success') {
      box.className = 'result-success';
      box.innerHTML = `<strong>${text}</strong>${explanation ? `<br><br>${explanation}` : ''}`;
      if (triggerHaptic && tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    } else if (status === 'warning') {
      box.className = 'result-warning';
      box.innerHTML = `<strong>${text}</strong>${explanation ? `<br><br>${explanation}` : ''}`;
      if (triggerHaptic && tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
    } else {
      box.className = 'result-error';
      box.innerHTML = `<strong>${text}</strong>${explanation ? `<br><br>${explanation}` : ''}`;
      if (triggerHaptic && tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
