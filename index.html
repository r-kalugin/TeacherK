<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Самоперевірка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f4f6f8);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #222222);
      --hint: var(--tg-theme-hint-color, #777777);
      --btn: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --success: #28a745;
      --warning: #d97706;
      --error: #dc3545;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      text-align: center;
      margin-bottom: 14px;
    }
    .task-image-container {
      margin-bottom: 16px;
      text-align: center;
      display: none;
    }
    .task-image {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid #e1e4e8;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .input-field {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      background: var(--card-bg);
      color: var(--text);
      transition: all 0.2s ease;
    }
    .input-field:focus {
      border-color: var(--btn);
    }
    .matching-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .matching-label {
      font-size: 16px;
      font-weight: bold;
    }
    .matching-select {
      padding: 8px 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1.5px solid #ddd;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
      transition: all 0.2s ease;
      min-width: 70px;
    }
    .select-correct {
      border-color: var(--success) !important;
      background-color: rgba(40, 167, 69, 0.12) !important;
      color: var(--success) !important;
      font-weight: bold;
    }
    .select-incorrect {
      border-color: var(--error) !important;
      background-color: rgba(220, 53, 69, 0.12) !important;
      color: var(--error) !important;
      font-weight: bold;
    }
    button.submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      font-size: 16px;
      font-weight: 600;
      background-color: var(--btn);
      color: var(--btn-text);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    #result-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 15px;
      line-height: 1.4;
    }
    .result-success {
      background-color: rgba(40, 167, 69, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }
    .result-warning {
      background-color: rgba(217, 119, 6, 0.15);
      color: var(--warning);
      border: 1px solid var(--warning);
    }
    .result-error {
      background-color: rgba(220, 53, 69, 0.15);
      color: var(--error);
      border: 1px solid var(--error);
    }
    .loader {
      text-align: center;
      color: var(--hint);
      padding: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2 id="task-title">Завантаження завдання...</h2>
    
    <div id="image-container" class="task-image-container">
      <img id="task-img" class="task-image" alt="Умова задачі" />
    </div>

    <div id="loader" class="loader">Зчитування даних із таблиці...</div>
    <div id="form-container" style="display: none;"></div>
    <div id="result-box"></div>
  </div>
</div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    try {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    } catch (e) {
      console.error(e);
    }
  }

  const SHEET_ID = '1rMrjDLFl08wdqO0vF2wRO1SUI-FmMULUUklqaUtP7Fg';

  function getTaskId() {
    const urlParams = new URLSearchParams(window.location.search);
    let taskId = urlParams.get('task');
    if (taskId) return taskId.trim();

    const tg = window.Telegram?.WebApp;
    if (tg?.initDataUnsafe?.start_param) {
      return String(tg.initDataUnsafe.start_param).trim();
    }

    if (window.location.hash) {
      const hash = window.location.hash.substring(1);
      const hashParams = new URLSearchParams(hash);
      const startParam = hashParams.get('tgWebAppStartParam');
      if (startParam) return decodeURIComponent(startParam).trim();

      const webAppData = hashParams.get('tgWebAppData');
      if (webAppData) {
        const innerParams = new URLSearchParams(webAppData);
        const innerStart = innerParams.get('start_param');
        if (innerStart) return decodeURIComponent(innerStart).trim();
      }
    }
    return null;
  }

  function parseCSVLine(line) {
    const result = [];
    let cur = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (inQuotes && line[i + 1] === '"') {
          cur += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        result.push(cur.trim());
        cur = '';
      } else {
        cur += char;
      }
    }
    result.push(cur.trim());
    return result;
  }

  function formatDriveUrl(url) {
    if (!url) return '';
    url = url.trim();
    const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (match && match[1]) {
      return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
    }
    const idMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
    if (idMatch && idMatch[1] && url.includes('drive.google.com')) {
      return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w1000`;
    }
    return url;
  }

  async function init() {
    const taskId = getTaskId();
    const titleEl = document.getElementById('task-title');
    const loaderEl = document.getElementById('loader');
    const formContainer = document.getElementById('form-container');
    const imgContainer = document.getElementById('image-container');
    const imgEl = document.getElementById('task-img');

    if (!taskId) {
      titleEl.innerText = "Помилка";
      loaderEl.innerText = "Не вказано номер завдання (?task=...).";
      return;
    }

    try {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
      const response = await fetch(url);
      if (!response.ok) throw new Error("HTTP " + response.status);
      const csvText = await response.text();

      const lines = csvText.split(/\r?\n/).filter(l => l.trim().length > 0);
      let task = null;

      for (let i = 1; i < lines.length; i++) {
        const cols = parseCSVLine(lines[i]);
        const idVal = cols[0] ? cols[0].replace(/^"|"$/g, '').trim() : '';
        if (idVal === taskId) {
          task = {
            task_id: idVal,
            task_type: (cols[1] || 'text').replace(/^"|"$/g, '').trim().toLowerCase(),
            correct_answer: cols[2] ? cols[2].replace(/^"|"$/g, '').trim() : '',
            explanation: cols[3] ? cols[3].replace(/^"|"$/g, '').trim() : '',
            image_url: cols[4] ? cols[4].replace(/^"|"$/g, '').trim() : ''
          };
          break;
        }
      }

      if (!task) {
        titleEl.innerText = "Завдання не знайдено";
        loaderEl.innerText = `Завдання з номером ${taskId} відсутнє в базі.`;
        return;
      }

      loaderEl.style.display = 'none';
      formContainer.style.display = 'block';

      let displayId = task.task_id;
      if (displayId.includes('.26_')) {
        displayId = displayId.replace('.26_', '.2026_');
      }
      titleEl.innerText = `📚 Задача дня_${displayId}`;

      const candidateUrl = formatDriveUrl(task.image_url) || `tasks/${task.task_id}.png`;
      imgEl.onload = () => { imgContainer.style.display = 'block'; };
      imgEl.onerror = () => {
        if (!task.image_url && !imgEl.dataset.triedJpg) {
          imgEl.dataset.triedJpg = 'true';
          imgEl.src = `tasks/${task.task_id}.jpg`;
        } else {
          imgContainer.style.display = 'none';
        }
      };
      imgEl.src = candidateUrl;

      renderForm(task);
    } catch (e) {
      titleEl.innerText = "Помилка зв'язку";
      loaderEl.innerText = "Не вдалося завантажити дані таблиці. Перевірте публікацію в інтернеті.";
    }
  }

  function updateDisabledOptions() {
    const selects = [1, 2, 3].map(n => document.getElementById(`match-${n}`));
    const selectedValues = selects.map(s => s.value).filter(v => v !== "");

    selects.forEach(select => {
      Array.from(select.options).forEach(opt => {
        if (!opt.value) return;
        opt.disabled = selectedValues.includes(opt.value) && select.value !== opt.value;
      });
    });
  }

  function renderForm(task) {
    const container = document.getElementById('form-container');
    const type = (task.task_type || '').trim();

    if (type === 'matching') {
      container.innerHTML = `
        <div style="margin-bottom: 14px; font-size: 14px; color: var(--hint);">
          Установіть відповідність для кожного пункту:
        </div>
        ${[1, 2, 3].map(num => `
          <div class="matching-row">
            <span class="matching-label">${num}</span>
            <select class="matching-select" id="match-${num}">
              <option value="">—</option>
              <option value="А">А</option>
              <option value="Б">Б</option>
              <option value="В">В</option>
              <option value="Г">Г</option>
              <option value="Д">Д</option>
            </select>
          </div>
        `).join('')}
        <button class="submit-btn" id="btn-check">Перевірити</button>
      `;

      [1, 2, 3].forEach(num => {
        const el = document.getElementById(`match-${num}`);
        el.addEventListener('change', () => {
          el.className = 'matching-select';
          updateDisabledOptions();
        });
      });

      document.getElementById('btn-check').addEventListener('click', () => {
        checkMatching(task.correct_answer, task.explanation);
      });
    } else {
      container.innerHTML = `
        <div style="margin-bottom: 10px; font-size: 14px; color: var(--hint);">Введіть отриману відповідь:</div>
        <input type="text" id="text-answer" class="input-field" placeholder="Наприклад: 120" autocomplete="off" />
        <button class="submit-btn" id="btn-check">Перевірити</button>
      `;

      const inputEl = document.getElementById('text-answer');
      inputEl.addEventListener('input', () => {
        inputEl.style.borderColor = '#ddd';
      });

      document.getElementById('btn-check').addEventListener('click', () => {
        checkText(task.correct_answer, task.explanation);
      });
    }
  }

  function normalizeLetter(ch) {
    ch = (ch || '').toUpperCase().trim();
    const map = {
      'A': 'А', 'B': 'В', 'C': 'С', 'E': 'Е', 'H': 'Н',
      'I': 'І', 'O': 'О', 'P': 'Р', 'T': 'Т', 'X': 'Х'
    };
    return map[ch] || ch;
  }

  function cleanString(str) {
    return (str || '').toString().toLowerCase().replace(/[\s\-_,.:;]/g, '').trim();
  }

  function checkText(correctAnswersRaw, explanation) {
    const inputEl = document.getElementById('text-answer');
    const cleanUser = cleanString(inputEl.value);
    const validList = (correctAnswersRaw || '').split(';').map(cleanString);

    const isCorrect = validList.includes(cleanUser);
    inputEl.style.borderColor = isCorrect ? 'var(--success)' : 'var(--error)';

    displayResult(
      isCorrect ? 'success' : 'error',
      isCorrect ? 'Чудово! Відповідь правильна 🎉' : 'Неправильно. Спробуйте ще раз!',
      explanation
    );
  }

  function extractAnswerFor(pattern, num) {
    const regex = new RegExp(num + '[\\s\\-–—:=]*([А-ЯA-ZІЇЄҐ])', 'i');
    const m = pattern.match(regex);
    return m ? normalizeLetter(m[1]) : '';
  }

  function checkMatching(correctPattern, explanation) {
    const el1 = document.getElementById('match-1');
    const el2 = document.getElementById('match-2');
    const el3 = document.getElementById('match-3');

    const m1 = normalizeLetter(el1.value);
    const m2 = normalizeLetter(el2.value);
    const m3 = normalizeLetter(el3.value);

    if (!m1 || !m2 || !m3) {
      alert("Будь ласка, оберіть варіанти для всіх трьох пунктів.");
      return;
    }

    if (m1 === m2 || m1 === m3 || m2 === m3) {
      alert("Усі три варіанти відповіді мають бути різними!");
      return;
    }

    const raw = (correctPattern || '').trim();
    let c1 = extractAnswerFor(raw, '1');
    let c2 = extractAnswerFor(raw, '2');
    let c3 = extractAnswerFor(raw, '3');

    if (!c1 && !c2 && !c3) {
      const letters = raw.replace(/[^А-ЯA-ZІЇЄҐа-яa-zіїєґ]/g, '');
      if (letters.length >= 3) {
        c1 = normalizeLetter(letters[0]);
        c2 = normalizeLetter(letters[1]);
        c3 = normalizeLetter(letters[2]);
      }
    }

    const applyHighlight = (el, isCorrect) => {
      el.className = 'matching-select ' + (isCorrect ? 'select-correct' : 'select-incorrect');
    };

    const is1Correct = (m1 === c1);
    const is2Correct = (m2 === c2);
    const is3Correct = (m3 === c3);

    applyHighlight(el1, is1Correct);
    applyHighlight(el2, is2Correct);
    applyHighlight(el3, is3Correct);

    let score = (is1Correct ? 1 : 0) + (is2Correct ? 1 : 0) + (is3Correct ? 1 : 0);

    if (score === 3) {
      displayResult('success', 'Чудово! Правильно: 3/3 🎉', explanation);
    } else if (score > 0) {
      displayResult('warning', `Частково правильно: ${score}/3. Спробуйте знайти помилку!`, explanation);
    } else {
      displayResult('error', 'Правильних відповідей: 0/3. Спробуйте ще раз!', explanation);
    }
  }

  function displayResult(status, text, explanation) {
    const box = document.getElementById('result-box');
    box.style.display = 'block';

    const tg = window.Telegram?.WebApp;
    if (status === 'success') {
      box.className = 'result-success';
      box.innerHTML = `<strong>${text}</strong>${explanation ? `<br><br>${explanation}` : ''}`;
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    } else if (status === 'warning') {
      box.className = 'result-warning';
      box.innerHTML = `<strong>${text}</strong>${explanation ? `<br><br>${explanation}` : ''}`;
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
    } else {
      box.className = 'result-error';
      box.innerHTML = `<strong>${text}</strong>${explanation ? `<br><br>${explanation}` : ''}`;
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>
</body>
</html>
