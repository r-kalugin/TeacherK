<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Самоперевірка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f4f6f8);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #222222);
      --hint: var(--tg-theme-hint-color, #777777);
      --btn: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --success: #28a745;
      --error: #dc3545;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      text-align: center;
      margin-bottom: 16px;
    }
    .input-field {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      background: var(--card-bg);
      color: var(--text);
    }
    .input-field:focus {
      border-color: var(--btn);
    }
    .matching-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .matching-label {
      font-size: 16px;
      font-weight: bold;
    }
    .matching-select {
      padding: 8px 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: var(--card-bg);
      color: var(--text);
    }
    button.submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      font-size: 16px;
      font-weight: 600;
      background-color: var(--btn);
      color: var(--btn-text);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    #result-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 15px;
      line-height: 1.4;
    }
    .result-success {
      background-color: rgba(40, 167, 69, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }
    .result-error {
      background-color: rgba(220, 53, 69, 0.15);
      color: var(--error);
      border: 1px solid var(--error);
    }
    .loader {
      text-align: center;
      color: var(--hint);
      padding: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2 id="task-title">Завантаження завдання...</h2>
    <div id="loader" class="loader">Зчитування даних із таблиці...</div>
    <div id="form-container" style="display: none;"></div>
    <div id="result-box"></div>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const SHEET_ID = '1rMrjDLFl08wdqO0vF2wRO1SUl-FmMULUUklqaUtP7Fg';

  function getTaskId() {
    const urlParams = new URLSearchParams(window.location.search);
    let taskId = urlParams.get('task');
    if (!taskId && tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      taskId = tg.initDataUnsafe.start_param;
    }
    return taskId ? taskId.trim() : null;
  }

  window.handleGoogleResponse = function(response) {
    const taskId = getTaskId();
    const titleEl = document.getElementById('task-title');
    const loaderEl = document.getElementById('loader');
    const formContainer = document.getElementById('form-container');

    if (!taskId) {
      titleEl.innerText = "Помилка";
      loaderEl.innerText = "Не вказано номер завдання (?task=...).";
      return;
    }

    if (!response || !response.table) {
      titleEl.innerText = "Помилка таблиці";
      loaderEl.innerText = "Не вдалося отримати записи з таблиці.";
      return;
    }

    const rows = response.table.rows || [];
    let task = null;

    const getVal = (cell) => {
      if (!cell) return '';
      if (cell.v !== undefined && cell.v !== null) return String(cell.v).trim();
      if (cell.f !== undefined && cell.f !== null) return String(cell.f).trim();
      return '';
    };

    for (let r of rows) {
      if (!r.c) continue;
      const idVal = getVal(r.c[0]);
      if (idVal === taskId) {
        task = {
          task_id: idVal,
          task_type: getVal(r.c[1]).toLowerCase() || 'text',
          correct_answer: getVal(r.c[2]),
          explanation: getVal(r.c[3])
        };
        break;
      }
    }

    if (!task) {
      titleEl.innerText = "Завдання не знайдено";
      loaderEl.innerText = `Завдання з номером ${taskId} відсутнє в базі.`;
      return;
    }

    loaderEl.style.display = 'none';
    formContainer.style.display = 'block';
    titleEl.innerText = `Завдання № ${task.task_id}`;

    renderForm(task);
  };

  function renderForm(task) {
    const container = document.getElementById('form-container');
    const type = (task.task_type || '').trim();

    if (type === 'matching') {
      container.innerHTML = `
        <div style="margin-bottom: 14px; font-size: 14px; color: var(--hint);">
          Установіть відповідність для кожного пункту:
        </div>
        ${[1, 2, 3].map(num => `
          <div class="matching-row">
            <span class="matching-label">${num}</span>
            <select class="matching-select" id="match-${num}">
              <option value="">—</option>
              <option value="А">А</option>
              <option value="Б">Б</option>
              <option value="В">В</option>
              <option value="Г">Г</option>
              <option value="Д">Д</option>
            </select>
          </div>
        `).join('')}
        <button class="submit-btn" onclick="checkMatching('${task.correct_answer}', '${encodeURIComponent(task.explanation || '')}')">Перевірити</button>
      `;
    } else {
      container.innerHTML = `
        <div style="margin-bottom: 10px; font-size: 14px; color: var(--hint);">Введіть отриману відповідь:</div>
        <input type="text" id="text-answer" class="input-field" placeholder="Наприклад: 120" autocomplete="off" />
        <button class="submit-btn" onclick="checkText('${task.correct_answer}', '${encodeURIComponent(task.explanation || '')}')">Перевірити</button>
      `;
    }
  }

  function cleanString(str) {
    return (str || '').toString().toLowerCase().replace(/[\s\-_,.:;]/g, '').trim();
  }

  window.checkText = function(correctAnswersRaw, encodedExplanation) {
    const input = document.getElementById('text-answer').value;
    const cleanUser = cleanString(input);
    const validList = correctAnswersRaw.split(';').map(cleanString);

    const isCorrect = validList.includes(cleanUser);
    displayResult(isCorrect, decodeURIComponent(encodedExplanation));
  };

  window.checkMatching = function(correctPattern, encodedExplanation) {
    const m1 = document.getElementById('match-1').value;
    const m2 = document.getElementById('match-2').value;
    const m3 = document.getElementById('match-3').value;

    if (!m1 || !m2 || !m3) {
      alert("Будь ласка, оберіть варіанти для всіх трьох пунктів.");
      return;
    }

    const userCombination = cleanString(`1${m1}2${m2}3${m3}`);
    const correctClean = cleanString(correctPattern);

    const isCorrect = (userCombination === correctClean);
    displayResult(isCorrect, decodeURIComponent(encodedExplanation));
  };

  function displayResult(isCorrect, explanation) {
    const box = document.getElementById('result-box');
    box.style.display = 'block';

    if (isCorrect) {
      box.className = 'result-success';
      box.innerHTML = `<strong>Чудово! Відповідь правильна 🎉</strong>${explanation ? `<br><br>${explanation}` : ''}`;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    } else {
      box.className = 'result-error';
      box.innerHTML = `<strong>Неправильно. Спробуйте ще раз!</strong>${explanation ? `<br><br>${explanation}` : ''}`;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }
  }

  window.onload = function() {
    const script = document.createElement('script');
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:handleGoogleResponse&headers=1`;
    script.onerror = function() {
      document.getElementById('task-title').innerText = "Помилка зв'язку";
      document.getElementById('loader').innerText = "Не вдалося завантажити дані таблиці. Перевірте публікацію в інтернеті.";
    };
    document.body.appendChild(script);
  };
</script>
</body>
</html>
