<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Самоперевірка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f4f6f8);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #222222);
      --hint: var(--tg-theme-hint-color, #777777);
      --btn: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --success: #28a745;
      --warning: #d97706;
      --error: #dc3545;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      text-align: center;
      margin-bottom: 16px;
    }
    .input-field {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      background: var(--card-bg);
      color: var(--text);
    }
    .input-field:focus {
      border-color: var(--btn);
    }
    .matching-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .matching-label {
      font-size: 16px;
      font-weight: bold;
    }
    .matching-select {
      padding: 8px 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: var(--card-bg);
      color: var(--text);
    }
    button.submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      font-size: 16px;
      font-weight: 600;
      background-color: var(--btn);
      color: var(--btn-text);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    #result-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 15px;
      line-height: 1.4;
    }
    .result-success {
      background-color: rgba(40, 167, 69, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }
    .result-warning {
      background-color: rgba(217, 119, 6, 0.15);
      color: var(--warning);
      border: 1px solid var(--warning);
    }
    .result-error {
      background-color: rgba(220, 53, 69, 0.15);
      color: var(--error);
      border: 1px solid var(--error);
    }
    .loader {
      text-align: center;
      color: var(--hint);
      padding: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2 id="task-title">Завантаження завдання...</h2>
    <div id="loader" class="loader">Зчитування даних із таблиці...</div>
    <div id="form-container" style="display: none;"></div>
    <div id="result-box"></div>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const SHEET_ID = '1rMrjDLFl08wdqO0vF2wRO1SUI-FmMULUUklqaUtP7Fg';

  function getTaskId() {
    const urlParams = new URLSearchParams(window.location.search);
    let taskId = urlParams.get('task');
    if (!taskId && tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      taskId = tg.initDataUnsafe.start_param;
    }
    return taskId ? taskId.trim() : null;
  }

  function parseCSVLine(line) {
    const result = [];
    let cur = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (inQuotes && line[i + 1] === '"') {
          cur += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        result.push(cur.trim());
        cur = '';
      } else {
        cur += char;
      }
    }
    result.push(cur.trim());
    return result;
  }

  async function init() {
    const taskId = getTaskId();
    const titleEl = document.getElementById('task-title');
    const loaderEl = document.getElementById('loader');
    const formContainer = document.getElementById('form-container');

    if (!taskId) {
      titleEl.innerText = "Помилка";
      loaderEl.innerText = "Не вказано номер завдання (?task=...).";
      return;
    }

    try {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
      const response = await fetch(url);
      if (!response.ok) throw new Error("HTTP " + response.status);
      const csvText = await response.text();

      const lines = csvText.split(/\r?\n/).filter(l => l.trim().length > 0);
      let task = null;

      for (let i = 1; i < lines.length; i++) {
        const cols = parseCSVLine(lines[i]);
        const idVal = cols[0] ? cols[0].replace(/^"|"$/g, '').trim() : '';
        if (idVal === taskId) {
          task = {
            task_id: idVal,
            task_type: (cols[1] || 'text').replace(/^"|"$/g, '').trim().toLowerCase(),
            correct_answer: cols[2] ? cols[2].replace(/^"|"$/g, '').trim() : '',
            explanation: cols[3] ? cols[3].replace(/^"|"$/g, '').trim() : ''
          };
          break;
        }
      }

      if (!task) {
        titleEl.innerText = "Завдання не знайдено";
        loaderEl.innerText = `Завдання з номером ${taskId} відсутнє в базі.`;
        return;
      }

      loaderEl.style.display = 'none';
      formContainer.style.display = 'block';

      let displayId = task.task_id;
      if (displayId.includes('.26_')) {
        displayId = displayId.replace('.26_', '.2026_');
      }
      titleEl.innerText = `📚 Задача дня_${displayId}`;

      renderForm(task);
    } catch (e) {
      titleEl.innerText = "Помилка зв'язку";
      loaderEl.innerText = "Не вдалося завантажити дані таблиці. Перевірте публікацію в інтернеті.";
    }
  }

  function renderForm(task) {
    const container = document.getElementById('form-container');
    const type = (task.task_type || '').trim();

    if (type === 'matching') {
      container.innerHTML = `
        <div style="margin-bottom: 14px; font-size: 14px; color: var(--hint);">
          Установіть відповідність для кожного пункту:
        </div>
        ${[1, 2, 3].map(num => `
          <div class="matching-row">
            <span class="matching-label">${num}</span>
            <select class="matching-select" id="match-${num}">
              <option value="">—</option>
              <option value="А">А</option>
              <option value="Б">Б</option>
              <option value="В">В</option>
              <option value="Г">Г</option>
              <option value="Д">Д</option>
            </select>
          </div>
        `).join('')}
        <button class="submit-btn" id="btn-check">Перевірити</button>
      `;

      document.getElementById('btn-check').addEventListener('click', () => {
        checkMatching(task.correct_answer, task.explanation);
      });
    } else {
      container.innerHTML = `
        <div style="margin-bottom: 10px; font-size: 14px; color: var(--hint);">Введіть отриману відповідь:</div>
        <input type="text" id="text-answer" class="input-field" placeholder="Наприклад: 120" autocomplete="off" />
        <button class="submit-btn" id="btn-check">Перевірити</button>
      `;

      document.getElementById('btn-check').addEventListener('click', () => {
        checkText(task.correct_answer, task.explanation);
      });
    }
  }

  function normalizeLetter(ch) {
    ch = (ch || '').toUpperCase().trim();
    const map = {
      'A': 'А', 'B': 'В', 'C': 'С', 'E': 'Е', 'H': 'Н',
      'I': 'І', 'O': 'О', 'P': 'Р', 'T': 'Т', 'X': 'Х'
    };
    return map[ch] || ch;
  }

  function cleanString(str) {
    return (str || '').toString().toLowerCase().replace(/[\s\-_,.:;]/g, '').trim();
  }

  function checkText(correctAnswersRaw, explanation) {
    const input = document.getElementById('text-answer').value;
    const cleanUser = cleanString(input);
    const validList = (correctAnswersRaw || '').split(';').map(cleanString);

    const isCorrect = validList.includes(cleanUser);
    displayResult(
      isCorrect ? 'success' : 'error',
      isCorrect ? 'Чудово! Відповідь правильна 🎉' : 'Неправильно. Спробуйте ще раз!',
      explanation
    );
  }

  function extractAnswerFor(pattern, num) {
    // Шукає цифру та першу літеру після неї (наприклад, "1А", "1-А", "1:А")
    const regex = new RegExp(num + '[\\s\\-–—:=]*([А-ЯA-ZІЇЄҐ])', 'i');
    const m = pattern.match(regex);
    return m ? normalizeLetter(m[1]) : '';
  }

  function checkMatching(correctPattern, explanation) {
    const m1 = normalizeLetter(document.getElementById('match-1').value);
    const m2 = normalizeLetter(document.getElementById('match-2').value);
    const m3 = normalizeLetter(document.getElementById('match-3').value);

    if (!m1 || !m2 || !m3) {
      alert("Будь ласка, оберіть варіанти для всіх трьох пунктів.");
      return;
    }

    const raw = (correctPattern || '').trim();
    let c1 = extractAnswerFor(raw, '1');
    let c2 = extractAnswerFor(raw, '2');
    let c3 = extractAnswerFor(raw, '3');

    // Якщо раптом у таблиці вказано просто "АГБ" без цифр
    if (!c1 && !c2 && !c3) {
      const letters = raw.replace(/[^А-ЯA-ZІЇЄҐа-яa-zіїєґ]/g, '');
      if (letters.length >= 3) {
        c1 = normalizeLetter(letters[0]);
        c2 = normalizeLetter(letters[1]);
        c3 = normalizeLetter(letters[2]);
      }
    }

    let score = 0;
    if (m1 === c1) score++;
    if (m2 === c2) score++;
    if (m3 === c3) score++;

    if (score === 3) {
      displayResult('success', 'Чудово! Правильно: 3/3 🎉', explanation);
    } else if (score > 0) {
      displayResult('warning', `Частково правильно: ${score}/3. Спробуйте ще раз!`, explanation);
    } else {
      displayResult('error', 'Правильних відповідей: 0/3. Спробуйте ще раз!', explanation);
    }
  }

  function displayResult(status, text, explanation) {
    const box = document.getElementById('result-box');
    box.style.display = 'block';

    if (status === 'success') {
      box.className = 'result-success';
      box.innerHTML = `<strong>${text}</strong>${explanation ? `<br><br>${explanation}` : ''}`;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    } else if (status === 'warning') {
      box.className = 'result-warning';
      box.innerHTML = `<strong>${text}</strong>${explanation ? `<br><br>${explanation}` : ''}`;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
    } else {
      box.className = 'result-error';
      box.innerHTML = `<strong>${text}</strong>${explanation ? `<br><br>${explanation}` : ''}`;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }
  }

  window.onload = init;
</script>
</body>
</html>
